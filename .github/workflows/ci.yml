name: Continuous Integration

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Run Ruff Linter & Formatter Check
        continue-on-error: true
        run: |
          pip install ruff
          ruff check .
          ruff format --check .

      - name: Run Mypy Type Check (Core Modules)
        continue-on-error: true
        run: |
          pip install mypy
          mypy agymolden/molecule_model.py agymolden/zmatrix.py agymolden/mcp_server.py agymolden/project_bundle.py agymolden/session_state.py

  test:
    name: Test on ubuntu-latest (Py 3.11)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglx-mesa0 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxkbcommon0 libxcb-xinerama0

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run Test Suite (Offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v tests/test_surfaces_and_orca_ui.py tests/test_volumetric.py tests/test_cycle_welder.py tests/test_format_roundtrip.py tests/test_layout_resolutions.py tests/test_apex_triad.py tests/test_diagnostics.py tests/test_verified_input_generators.py

  test-cross-os:
    if: github.event_name == 'workflow_dispatch'
    name: Test on ${{ matrix.os }} (Py 3.11)
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run Test Suite (Offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v tests/test_surfaces_and_orca_ui.py tests/test_volumetric.py tests/test_cycle_welder.py tests/test_format_roundtrip.py tests/test_layout_resolutions.py tests/test_apex_triad.py tests/test_diagnostics.py tests/test_verified_input_generators.py
