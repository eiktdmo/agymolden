name: Release One-Click Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  bundle:
    name: Build & Release One-Click Universal Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build One-Click Bundle Zip
        run: |
          chmod +x scripts/make_oneclick_bundle.sh
          ./scripts/make_oneclick_bundle.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgyMolden_OneClick_Bundle
          path: AgyMolden_OneClick_Bundle.zip
          retention-days: 7
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AgyMolden_OneClick_Bundle.zip
            dist/*.whl
          generate_release_notes: true
          draft: false
          prerelease: false
