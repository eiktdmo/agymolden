{% set name = "agymolden" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/agymolden-{{ version }}.tar.gz
  # sha256 will be updated upon PyPI release publication

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - agymolden = agymolden:main

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=61
  run:
    - python >=3.9
    - pyqt >=6.4
    - pyopengl >=3.1
    - numpy >=1.23
    - scipy >=1.9
    - matplotlib-base >=3.5
    - scikit-image >=0.19
    - cclib >=1.7

test:
  imports:
    - agymolden
    - agymolden.zmatrix
    - agymolden.forcefield
    - agymolden.qm_log_parser
  commands:
    - agymolden --help

about:
  home: https://github.com/eiktdmo/newagy
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "AgyMolden: Molden-inspired 3D internal-coordinate (Z-matrix) molecular editor and unified quantum chemistry workflow cockpit"
  description: |
    AgyMolden combines intuitive internal coordinate (Z-matrix) editing workflows
    with a complete computational chemistry environment: multi-package calculation execution
    (ORCA, Gaussian, Psi4, PySCF, xTB), live convergence tracking, automated error
    diagnostics (QC Doctor™), volumetric orbital & ESP visualization, IRC reaction profiling,
    and publication SI table generation.
  doc_url: https://github.com/eiktdmo/newagy/blob/main/docs/USER_MANUAL.md
  dev_url: https://github.com/eiktdmo/newagy

extra:
  recipe-maintainers:
    - eiktdmo
